
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .twinkle { animation: twinkle 2s steps(2) infinite; }
    .t2 { animation-delay: .7s; }
    .t3 { animation-delay: 1.3s; }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .15; } }

    .hero { animation: hop 1s steps(1) infinite; }
    @keyframes hop {
      0%   { transform: translateY(0); }
      25%  { transform: translateY(-16px); }
      50%  { transform: translateY(-24px); }
      75%  { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }

    .coin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s steps(1) infinite; }
    @keyframes spin {
      0%   { transform: scaleX(1); }
      25%  { transform: scaleX(.5); }
      50%  { transform: scaleX(.1); }
      75%  { transform: scaleX(.5); }
      100% { transform: scaleX(1); }
    }

    .cloud { animation: drift 40s linear infinite; }
    .c2 { animation-duration: 55s; animation-delay: -20s; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(920px); } }

    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <!-- Sky bands -->
  <rect x="0" y="0"   width="800" height="60"  fill="#0b0e2a"/>
  <rect x="0" y="60"  width="800" height="40"  fill="#12174a"/>
  <rect x="0" y="100" width="800" height="30"  fill="#1c2466"/>
  <rect x="0" y="130" width="800" height="22"  fill="#2a3790"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <rect class="twinkle"    x="40"  y="20" width="4" height="4"/>
    <rect class="twinkle t2" x="150" y="40" width="4" height="4"/>
    <rect class="twinkle t3" x="260" y="16" width="4" height="4"/>
    <rect class="twinkle"    x="340" y="52" width="4" height="4"/>
    <rect class="twinkle t2" x="430" y="24" width="4" height="4"/>
    <rect class="twinkle t3" x="520" y="44" width="4" height="4"/>
    <rect class="twinkle"    x="610" y="18" width="4" height="4"/>
    <rect class="twinkle t2" x="760" y="60" width="4" height="4"/>
    <rect class="twinkle t3" x="80"  y="84" width="4" height="4"/>
    <rect class="twinkle"    x="470" y="90" width="4" height="4"/>
  </g>

  <!-- Moon -->
  <g fill="#fff6b0">
    <rect x="712" y="24" width="24" height="8"/>
    <rect x="704" y="32" width="40" height="24"/>
    <rect x="712" y="56" width="24" height="8"/>
  </g>
  <g fill="#e0d27a">
    <rect x="712" y="36" width="8" height="8"/>
    <rect x="728" y="46" width="8" height="8"/>
  </g>

  <!-- Clouds -->
  <g class="cloud" opacity=".55" fill="#9aa6ff">
    <rect x="0"  y="72" width="32" height="8"/>
    <rect x="-8" y="80" width="56" height="8"/>
    <rect x="8"  y="88" width="40" height="8"/>
  </g>
  <g class="cloud c2" opacity=".4" fill="#9aa6ff">
    <rect x="0"  y="44" width="24" height="8"/>
    <rect x="-8" y="52" width="48" height="8"/>
  </g>

  <!-- Tree -->
  <g>
    <rect x="568" y="120" width="16" height="32" fill="#6b3f1d"/>
    <rect x="552" y="88"  width="48" height="8"  fill="#1e8e4a"/>
    <rect x="544" y="96"  width="64" height="24" fill="#27ae60"/>
    <rect x="552" y="120" width="48" height="8"  fill="#1e8e4a"/>
    <rect x="560" y="80"  width="32" height="8"  fill="#27ae60"/>
  </g>

  <!-- Coin -->
  <g class="coin">
    <rect x="300" y="84" width="16" height="4"  fill="#ffd700"/>
    <rect x="296" y="88" width="24" height="24" fill="#ffd700"/>
    <rect x="300" y="112" width="16" height="4" fill="#ffd700"/>
    <rect x="304" y="92" width="8"  height="16" fill="#c9a400"/>
  </g>

  <!-- Hero -->
  <g class="hero" transform="translate(120,72)">
    <!-- hair -->
    <rect x="16" y="0"  width="32" height="8" fill="#5b3a1a"/>
    <rect x="8"  y="8"  width="48" height="8" fill="#5b3a1a"/>
    <!-- face -->
    <rect x="8"  y="16" width="48" height="8" fill="#f2c9a0"/>
    <rect x="16" y="16" width="8"  height="8" fill="#111"/>
    <rect x="40" y="16" width="8"  height="8" fill="#111"/>
    <rect x="16" y="24" width="32" height="8" fill="#f2c9a0"/>
    <!-- body -->
    <rect x="8"  y="32" width="48" height="8" fill="#00d9ff"/>
    <rect x="0"  y="40" width="8"  height="8" fill="#f2c9a0"/>
    <rect x="8"  y="40" width="48" height="8" fill="#00d9ff"/>
    <rect x="56" y="40" width="8"  height="8" fill="#f2c9a0"/>
    <rect x="8"  y="48" width="48" height="8" fill="#00b8d9"/>
    <!-- legs -->
    <rect x="8"  y="56" width="48" height="8" fill="#3b4cca"/>
    <rect x="8"  y="64" width="16" height="8" fill="#3b4cca"/>
    <rect x="40" y="64" width="16" height="8" fill="#3b4cca"/>
    <rect x="8"  y="72" width="16" height="8" fill="#222"/>
    <rect x="40" y="72" width="16" height="8" fill="#222"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="152" width="800" height="8"  fill="#2ecc71"/>
  <rect x="0" y="160" width="800" height="40" fill="#8b5a2b"/>
  <g fill="#6b3f1d">
    <rect x="24"  y="168" width="16" height="8"/>
    <rect x="120" y="184" width="16" height="8"/>
    <rect x="232" y="170" width="16" height="8"/>
    <rect x="344" y="186" width="16" height="8"/>
    <rect x="456" y="168" width="16" height="8"/>
    <rect x="568" y="184" width="16" height="8"/>
    <rect x="680" y="170" width="16" height="8"/>
    <rect x="768" y="186" width="16" height="8"/>
  </g>
  <g fill="#27ae60">
    <rect x="0"   y="152" width="8" height="4"/>
    <rect x="64"  y="152" width="8" height="4"/>
    <rect x="200" y="152" width="8" height="4"/>
    <rect x="410" y="152" width="8" height="4"/>
    <rect x="640" y="152" width="8" height="4"/>
  </g>

  <!-- PRESS START (blinking pixel text built from blocks) -->
  <g class="blink" fill="#ffd700">
    <!-- small arrow/cursor -->
    <rect x="380" y="20" width="8"  height="8"/>
    <rect x="388" y="28" width="8"  height="8"/>
    <rect x="380" y="36" width="8"  height="8"/>
  </g>
</svg>
